name: daily-digest

on:
  schedule:
    - cron: "17 10 * * *"   # 07:17 en Buenos Aires (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Variable del repo (Settings > Secrets and variables > Actions > Variables).
      # Si está vacía, el digest se sube como artifact y no se commitea a ningún lado.
      VAULT_REPO: ${{ vars.VAULT_REPO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt && pip install -e .

      - name: Clonar el vault privado
        if: ${{ env.VAULT_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VAULT_REPO }}
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault

      - name: Generar digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$VAULT_REPO" ]; then OUT=vault/07-trends; else OUT=out; fi
          python -m trends_agent run --config config.yaml \
            --out-dir "$OUT" --seen-file "$OUT/.seen.json"

      - name: Commitear el digest al vault
        if: ${{ env.VAULT_REPO != '' }}
        working-directory: vault
        run: |
          git config user.name "trends-agent"
          git config user.email "trends-agent@users.noreply.github.com"
          git add 07-trends
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "digest $(date -u +%F)"
            git push
          fi

      - name: Subir digest como artifact
        if: ${{ env.VAULT_REPO == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: out/
          retention-days: 14
